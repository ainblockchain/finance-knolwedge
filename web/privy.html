<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Privy</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Design system: modelled on dashboard.privy.io (light ground, indigo accent, white cards, hairline borders, status pills)
   with editorial figures — large numerals, small letter-spaced labels, hairline dividers. Single column. */
:root{--ground:#F5F5F9;--surface:#FFFFFF;--line:#E4E4EE;--line-2:#D3D3E0;--ink:#15152B;--ink-2:#4B4B63;--ink-3:#7C7C93;
      --accent:#5B4CF5;--accent-soft:#EEEDFD;--accent-ink:#3F32C7;
      --exec:#1E8E4A;--exec-soft:#E6F6EC;--deny:#D23F3F;--deny-soft:#FCEBEB;--warn:#B7791F;--warn-soft:#FFF4DF}
body{background:var(--ground);color:var(--ink);font-family:"Inter",-apple-system,"Noto Sans KR",system-ui,sans-serif;font-size:14.5px;line-height:1.55}
/* shared header stays as the rest of the demo has it */
nav{background:#171a21;border-color:#262b36}nav .brand{color:#5aa9ff}nav a{color:#8b93a7}nav a.on,nav a:hover{background:#232836;color:#e6e8ee}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;font-size:13px}
main.privy{max-width:1120px;margin:0 auto;padding:0 24px 72px}
/* KPI strip — dashboard tiles */
.rail{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:22px 0 0}@media(max-width:1000px){.rail{grid-template-columns:repeat(4,1fr)}}@media(max-width:640px){.rail{grid-template-columns:repeat(2,1fr)}}
.rail span{display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);overflow:hidden}
.rail span b{display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .live b,.rail .mock b{font-family:"Inter",sans-serif;font-weight:600;display:flex;align-items:center;gap:7px}
.rail .live b::before,.rail .mock b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.rail .mock{background:var(--warn-soft);border-color:transparent;color:var(--warn)}.rail .mock b{color:inherit}.rail .mock b::before{background:var(--warn)}
/* hero */
.hero-body{display:grid;grid-template-columns:1fr 340px;gap:32px;align-items:center;margin-top:6px}
.hero-text p{font-size:15.5px;line-height:1.7;margin:0 0 14px}.hero-text p:last-child{margin-bottom:0}@media(max-width:900px){.hero-body{grid-template-columns:1fr}}
.anim-card{background:linear-gradient(180deg,#F7F6FE 0%,#FFFFFF 100%);border:1px solid #E2DFFA;border-radius:12px;padding:12px}.anim-card svg{display:block;width:100%;height:auto}
.diagram{margin:28px 0 6px;padding:22px 24px 10px;background:linear-gradient(180deg,#F7F6FE 0%,#FFFFFF 100%);border:1px solid #E2DFFA;border-radius:12px}
.diagram svg{display:block;width:100%;height:auto}
@media(max-width:700px){.diagram{display:none}}
.hero{padding:44px 0 30px;border-bottom:1px solid var(--line-2)}
.hero h1{font-size:34px;line-height:1.2;margin:0 0 18px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.hero p{max-width:760px;margin:0 0 10px;color:var(--ink-2);font-size:15px}.hero p.sub{color:var(--ink-3)}.hero b{color:var(--ink);font-weight:600}
.nums{display:grid;grid-template-columns:repeat(4,1fr);margin-top:30px;border-top:1px solid var(--line-2)}
@media(max-width:860px){.nums{grid-template-columns:repeat(2,1fr)}}
.nums>div{padding:18px 18px 16px 0;border-right:1px solid var(--line);margin-right:18px}.nums>div:last-child{border-right:0}
.nums .n{font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:400;letter-spacing:-.01em;color:var(--accent-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.nums .n .from{color:var(--ink-3);font-size:18px}
.nums .l{margin-top:8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}.nums a{color:inherit;text-decoration:none}.nums a:hover{color:var(--accent)}
/* run bar */
.run{display:flex;gap:10px;margin:30px 0 12px}
.run input{flex:1;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);padding:12px 14px;font:inherit;border-radius:8px}
.run input:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.run button{background:var(--accent);color:#fff;border:0;padding:12px 18px;font:inherit;font-weight:600;border-radius:8px;cursor:pointer}
.run button:hover{background:var(--accent-ink)}.run button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.chips button{background:var(--accent-soft);border:0;color:var(--accent-ink);padding:6px 11px;font:inherit;font-size:12.5px;font-weight:500;border-radius:999px;cursor:pointer}.chips button:hover{background:#E2E0FB}
/* lanes */
.lanes{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:860px){.lanes{grid-template-columns:1fr}}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px;min-height:320px;display:flex;flex-direction:column;gap:10px}
.lane .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.lane .hd b{font-size:12px;color:var(--ink);font-weight:600;letter-spacing:.06em}
.lane .code{font-family:"IBM Plex Mono",monospace;font-size:64px;line-height:1;font-weight:400;letter-spacing:-.01em;margin:10px 0 0;min-height:64px;color:var(--ink)}
.lane .code.deny{color:var(--deny)}.lane .code.exec{color:var(--exec)}.lane .code.idle,.lane .code.error{color:var(--line-2)}
.lane .exp{color:var(--ink-3);font-size:12.5px}.lane .exp b{color:var(--ink);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.deny{background:var(--deny-soft);color:var(--deny)}.pill.exec{background:var(--exec-soft);color:var(--exec)}.pill.error{background:var(--warn-soft);color:var(--warn)}.pill.idle{background:var(--ground);color:var(--ink-3)}
.lane .to{word-break:break-all;color:var(--ink-3);font-size:13px}.lane .to b{color:var(--ink);font-weight:500}
.lane .note{color:var(--ink-2);font-size:14px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
details summary{cursor:pointer;color:var(--accent-ink);font-size:12.5px;user-select:none;margin-top:6px}
pre.raw{background:var(--ground);border:1px solid var(--line);padding:12px;margin:8px 0 0;overflow:auto;max-height:280px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.45;color:var(--ink-2);border-radius:6px}
/* section labels */
h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:44px 0 12px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:var(--line-2)}
/* ledger — dashboard table */
table.ledger{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.ledger th{background:var(--ground);color:var(--ink-3);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
table.ledger td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top;color:var(--ink-2)}
table.ledger tr:last-child td{border-bottom:0}
table.ledger td.mono,table.ledger th.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
table.ledger a{color:var(--accent-ink);text-decoration:none}table.ledger a:hover{text-decoration:underline}
table.ledger .st-deny,table.ledger .st-exec,table.ledger .st-error{display:inline-block;padding:2px 9px;border-radius:999px;font-family:"Inter",sans-serif;font-size:11.5px;font-weight:600}
table.ledger .st-deny{background:var(--deny-soft);color:var(--deny)}table.ledger .st-exec{background:var(--exec-soft);color:var(--exec)}table.ledger .st-error{background:var(--warn-soft);color:var(--warn)}
table.ledger td.reason{color:var(--ink-3);max-width:360px}
/* how it works */
.how{color:var(--ink-2);font-size:14px;max-width:820px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 22px}
.how b{color:var(--ink);font-weight:600}.how ol{padding-left:18px;margin:12px 0}.how li{margin:8px 0}.how .mono{background:var(--ground);padding:1px 6px;border-radius:4px;color:var(--ink)}
/* registry */
.reg{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 18px}
@media(max-width:860px){.reg{grid-template-columns:1fr}}
.reg div{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:baseline}.reg div:nth-last-child(-n+2){border-bottom:0}
.reg .nm{min-width:96px;color:var(--ink);font-weight:500}.reg .cd{color:var(--accent-ink);font-weight:500}.reg .ad{color:var(--ink-3);word-break:break-all}.reg .bg{color:var(--deny);margin-left:auto;white-space:nowrap}
/* evidence */
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:860px){.shots{grid-template-columns:1fr}}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:0}
.shot figcaption{padding:10px 14px;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line)}
.shot-empty{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:12.5px;text-align:center;padding:16px;background:var(--ground)}
.shot img{display:block;width:100%}
</style></head><body><script src="nav.js"></script>

const L=()=>(window.I18N&&T[window.I18N.lang])?window.I18N.lang:'en';const tr=()=>T[L()];

/* ───── hook 1: lane ───── */
function render(o){const {side,code,state,note,raw,expected,answer,to,verified,hash,explorer,latency}=o;LAST[side]=o;const t=tr();
  const Lx=$('#lane-'+side);const st=state||'idle';
  Lx.querySelector('.code').className='code '+st;Lx.querySelector('.code').textContent=code||'——————';
  Lx.querySelector('.exp').innerHTML=`${t.expected} <b>${esc(expected||'—')}</b> · ${t.answer} <span class="mono">${esc(answer??'—')}</span>${latency?` · <span class="mono">${latency} ms</span>`:''}`;
  Lx.querySelector('.pill').outerHTML=`<span class="pill ${st}">${t.pill[st]}</span>`;
  Lx.querySelector('.to').innerHTML=to?`${t.recipient} <b class="mono">${esc(to)}</b> · ${verified?t.verified:'<span style="color:var(--deny)">'+t.unverified+'</span>'}${hash?` · <a class="mono" style="color:var(--ink)" target="_blank" href="${explorer||'#'}">${short(hash)}</a>`:''}`:`${t.recipient} —`;
  Lx.querySelector('.note').innerHTML=(typeof note==='function'?note(t):esc(note||''))+(raw?`<details><summary>${t.raw}</summary><pre class="raw">${esc(JSON.stringify(raw,null,1))}</pre></details>`:'');
}
/* ───── hook 2: ledger row ───── */
function appendRow({time,name,model,code,amount,state,reason,hash,explorer}){const t=tr();
  const trw=document.createElement('tr');
  trw.innerHTML=`<td class="mono">${esc(time)}</td><td>${esc(name)}</td><td>${model==='before'?t.modelBefore:t.modelAfter}</td><td class="mono">${esc(code||'—')}</td><td class="mono">${amount!=null?eth(amount):'—'}</td><td><span class="st-${state}">${t.st[state]||state}</span></td><td class="reason mono">${esc(reason||'')}</td><td class="mono">${hash?`<a target="_blank" href="${explorer||'#'}">${short(hash)}</a>`:'—'}</td>`;
  $('#ledger').prepend(trw);
}
/* ───── wiring ───── */
function noteFor(r){return (t)=>{if(r.verdict==='deny')return esc(t.noteDeny(r));if(r.verdict==='exec')return esc(t.noteExec(r));return esc((r.privy_raw&&r.privy_raw.error)||t.pill.error);};}
function rowFor(r){return {time:new Date((r.t||Date.now()/1000)*1000).toLocaleTimeString('en-GB',{hour12:false}),name:r.company,model:r.model,code:r.code,amount:r.amount_wei,state:r.verdict,reason:r.privy_raw?(r.privy_raw.code||r.privy_raw.error||''):'',hash:r.tx_hash,explorer:r.explorer};}
async function settle(model,instruction,batch){const res=await fetch(batch?'/settle/batch':'/settle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({instruction,model})});const r=await res.json();if(!res.ok)throw new Error(r.error||res.status);return r;}
/* Several companies in one instruction → batch: a hallucinated leg is denied alone, the others settle. */
function renderBatch(model,b){const legs=b.legs||[];const sm=b.summary||{};const st=sm.deny>0?'deny':(sm.exec>0?'exec':'error');
  render({side:model,code:`${sm.exec||0}/${legs.length}`,state:st,expected:legs.map(l=>l.expected_code).join(' '),answer:legs.map(l=>l.model_answer).join(' / '),
    note:(t)=>esc(t.batchNote(legs.length,sm)+legs.map(l=>`${l.company} ${l.code||'—'} → ${t.st[l.verdict]||l.verdict}`).join(' · ')+(sm.deny>0?t.batchTail:'')),
    raw:legs.map(l=>({company:l.company,code:l.code,verdict:l.verdict,request:l.privy_request||null,response:l.privy_raw,tx_hash:l.tx_hash})),
    to:legs.map(l=>short(l.to)).join(' · '),verified:legs.every(l=>l.verified_recipient)});
  const el=$('#lane-'+model+' .code');el.style.fontSize='40px';for(const l of legs)if(l.company)appendRow(rowFor(l));}
async function run(){const instruction=$('#instr').value.trim();if(!instruction)return;$('#run').disabled=true;
  const batch=REG.filter(r=>instruction.includes(r.name)).length>1;
  for(const s of['before','after']){render({side:s,code:null,state:'idle',note:(t)=>t.running,expected:'—',answer:'…'});$('#lane-'+s+' .code').style.fontSize='';}
  const results=await Promise.all(['before','after'].map(async model=>{try{return await settle(model,instruction,batch);}catch(e){return {model,verdict:'error',privy_raw:{error:String(e)},company:'',code:null,amount_wei:null};}}));
  for(const r of results){if(batch&&r.legs){renderBatch(r.model,r);continue;}
    render({side:r.model,code:r.code,state:r.verdict,note:noteFor(r),raw:{request:r.privy_request||null,response:r.privy_raw,model_answer:r.model_answer,prompt:r.prompt},expected:r.expected_code,answer:r.model_answer,to:r.to,verified:r.verified_recipient,hash:r.tx_hash,explorer:r.explorer,latency:r.latency_ms});
    if(r.company)appendRow(rowFor(r));}
  $('#run').disabled=false;loadStatus();}
$('#run').onclick=run;$('#instr').addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter'){e.preventDefault();run();}});
function renderRail(){if(!ST)return;const t=tr();const live=ST.mode==='privy';
  $('#rail').innerHTML=[`<span class="${live?'live':'mock'}">${t.railMode}<b>${live?t.live:t.mock}</b></span>`,`<span>${t.railWallet}<b title="${ST.wallet_address}">${short(ST.wallet_address)}</b></span>`,`<span>${t.railPolicy}<b title="${ST.policy_id}">${(ST.policy_id||"").slice(0,8)}…${(ST.policy_id||"").slice(-4)}</b></span>`,`<span>${t.railBalance}<b>${ST.balance_eth!=null?ST.balance_eth.toFixed(6)+' ETH':'—'}</b></span>`,`<span>${t.railChain}<b>${ST.caip2}</b></span>`,`<span>${t.railCap}<b>${eth(ST.amount_wei)}</b></span>`,`<span>${t.railReg}<b>${ST.registry_size}</b></span>`].join('');}
function renderLedger(){$('#ledger').innerHTML='';for(const r of ((ST&&ST.ledger)||[]))if(r.company)appendRow(rowFor(r));}
async function loadStatus(){try{ST=await (await fetch('/api/privy/status')).json();}catch(e){return;}renderRail();renderLedger();}
function renderRegistry(){const t=tr();
  $('#reg').innerHTML=REG.map(r=>`<div><span class="nm">${esc(r.name)}</span><span class="cd mono">${r.code}</span><span class="ad mono">${r.address}</span>${r.before_generation?`<span class="bg mono" title="${t.baseTitle}">${t.base}${esc(r.before_generation)}</span>`:''}</div>`).join('');
  const chips=$('#chips');chips.innerHTML='';['태양기계','엑시온그룹','성원에너텍','닷밀','KR모터스','픽셀플러스'].filter(n=>REG.some(r=>r.name===n)).forEach(n=>{const b=document.createElement('button');b.textContent=L()==='ko'?n+'에 대금 지급':t.pay+n;b.onclick=()=>{$('#instr').value=n+'에 대금 지급';run();};chips.appendChild(b);});
  const multi=document.createElement('button');multi.textContent=(L()==='ko'?'태양기계, 픽셀플러스, 닷밀에 대금 지급':t.pay+'태양기계, 픽셀플러스, 닷밀')+t.batch;multi.onclick=()=>{$('#instr').value='태양기계, 픽셀플러스, 닷밀에 대금 지급';run();};chips.appendChild(multi);}
async function loadRegistry(){const {registry}=await (await fetch('/api/privy/registry')).json();REG=registry;renderRegistry();}
function applyLang(){const t=tr();document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t[el.dataset.i18n];if(typeof v==='string')el.innerHTML=v;});
  for(const side of['before','after'])render(LAST[side]||{side,code:null,state:'idle',note:(t)=>side==='before'?t.idleBefore:t.idleAfter,expected:'—',answer:'—'});
  renderRail();renderLedger();renderRegistry();}
window.addEventListener('langchange',applyLang);
document.querySelectorAll('.shot-empty').forEach(d=>{const img=new Image();img.onload=()=>{d.replaceWith(img);};img.src=d.dataset.img;});
applyLang();loadStatus();loadRegistry();setInterval(loadStatus,20000);
</script></body></html>
